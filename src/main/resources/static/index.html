<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CareDocWeb - 介護認定申請書 作成アプリ</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <div class="header-title-row">
            <h1>CareDocWeb</h1>
            <p class="header-catchcopy">💡このアプリを使うと、手書きやExcelで10分以上かかる介護認定申請書を1秒前後で作成できます！</p>
            <a href="admin.html" class="admin-link">→ 管理画面へ</a>
        </div>
        <p>介護認定申請書 作成アプリ</p>
    </header>

    <main>
        <section class="section">
            <h2>申請書PDF作成</h2>
            <form id="pdf-form">
                <div class="form-group">
                    <label for="member-select">利用者を選択</label>
                    <select id="member-select" name="memberId" required>
                        <option value="">-- 選択してください --</option>
                    </select>
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label for="app-year">申請年</label>
                        <select id="app-year" name="applicationYear" required></select>
                    </div>
                    <div class="form-group">
                        <label for="app-month">申請月</label>
                        <select id="app-month" name="applicationMonth" required></select>
                    </div>
                    <div class="form-group">
                        <label for="app-day">申請日</label>
                        <select id="app-day" name="applicationDay" required></select>
                    </div>
                </div>
                <div class="form-group">
                    <label for="change-reason">変更更新理由</label>
                    <input type="text" id="change-reason" name="changeReason" placeholder="変更更新の場合のみ入力してください">
                </div>
                <div class="pdf-action-row">
                    <button
                        id="pdf-generate-btn"
                        type="button"
                        class="btn btn-primary"
                        onclick="generatePdf()">
                        PDF生成・ダウンロード
                    </button>
                    <span id="pdf-loading-message" class="pdf-status"></span>
                </div>
            </form>
            <div id="pdf-message" class="message"></div>
        </section>
    </main>

    <footer>
        <ul>
            <li>本テンプレートは、東京都中央区が公開している介護認定申請書の様式を基に作成したものです。</li>
            <li>個人番号、医療保険、特定疾病名の項目は、自動転記の対象としておりません。</li>
        </ul>
        <p class="footer-credit">© 2026 masalog — <a href="https://github.com/masalog" target="_blank" rel="noopener">GitHub</a></p>
    </footer>

    <script src="app.js"></script>
</body>
</html>
